<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Study Vault | AP Mathematics</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #050505;
            --bg-card: #121212;
            --gold: #eab308;
            --pink: #ff2a75;
            --cyan: #00bcd4;
            --green: #22c55e;
            --purple: #a855f7;
            --text-light: #ffffff;
            --text-dim: #a3a3a3;
            --border-dark: #262626;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; text-transform: uppercase; }
        body { background-color: var(--bg-main); color: var(--text-light); overflow-x: hidden; padding-bottom: 60px; }

        /* ========================================== */
        /* --- HEADER & SPINNING LOGO --- */
        /* ========================================== */
        .portal-header {
            background: var(--bg-card); border-bottom: 2px solid var(--gold);
            padding: 15px 5%; display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 100; box-shadow: 0 5px 20px rgba(0,0,0,0.8);
        }
        .header-logo-box { display: flex; align-items: center; gap: 20px; }
        .logo-spin-wrap {
            position: relative; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; background: #000; width: 45px; height: 45px; z-index: 1;
        }
        .logo-spin-wrap::before {
            content: ''; position: absolute; inset: -4px; border-radius: 50%;
            border: 2px solid transparent; border-top: 2px solid var(--pink); border-bottom: 2px solid var(--cyan);
            animation: spinBorder 1.5s linear infinite; z-index: -1;
        }
        .logo-spin-wrap::after {
            content: ''; position: absolute; inset: -8px; border-radius: 50%;
            border: 2px dotted var(--gold); animation: spinBorder 4s linear infinite reverse; z-index: -2; opacity: 0.8;
        }
        .inner-img { width: 100%; height: 100%; border-radius: 50%; object-fit: contain; background: #111; padding: 3px; border: 1px solid #222; }
        @keyframes spinBorder { 100% { transform: rotate(360deg); } }

        .header-text h1 { font-size: 1.2rem; color: #fff; font-weight: 900; letter-spacing: 1px; margin-bottom: 2px;}
        .header-text p { font-size: 0.7rem; color: var(--gold); font-weight: 700; letter-spacing: 1.5px;}

        /* ========================================== */
        /* --- MAIN CONTAINER & DROPDOWN --- */
        /* ========================================== */
        .vault-container { max-width: 1200px; margin: 0 auto; padding: 30px 5%; }
        
        .custom-dropdown-container { position: relative; max-width: 450px; margin-bottom: 35px; z-index: 50; }
        .dropdown-header {
            background: linear-gradient(145deg, #1a1a1a, var(--bg-card)); color: var(--gold); 
            border: 2px solid var(--gold); padding: 16px 24px; border-radius: 12px; font-size: 1.1rem; font-weight: 800;
            display: flex; justify-content: space-between; align-items: center; cursor: pointer;
            box-shadow: 0 5px 20px rgba(234, 179, 8, 0.15); transition: 0.3s;
        }
        .dropdown-header:hover { background: #1f1f1f; transform: translateY(-2px); }
        .dropdown-list {
            position: absolute; top: 110%; left: 0; width: 100%; background: var(--bg-card);
            border: 2px solid var(--border-dark); border-radius: 12px; overflow: hidden;
            display: none; flex-direction: column; box-shadow: 0 15px 40px rgba(0,0,0,0.9);
        }
        .dropdown-list.show { display: flex; animation: slideDown 0.3s ease; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        .dropdown-item {
            padding: 15px 20px; color: var(--text-light); font-weight: 600; font-size: 1rem;
            cursor: pointer; border-bottom: 1px solid var(--border-dark); transition: 0.2s;
        }
        .dropdown-item:last-child { border-bottom: none; }
        .dropdown-item:hover, .dropdown-item.active-item { background: rgba(234, 179, 8, 0.1); color: var(--gold); padding-left: 25px; border-left: 4px solid var(--gold);}

        .section-title { 
            font-size: 1.8rem; font-weight: 900; margin-bottom: 25px; 
            border-left: 6px solid var(--pink); padding-left: 15px; letter-spacing: 1px; 
        }
        .section-title span { color: var(--pink); }

        /* ========================================== */
        /* --- A4 POSTER GRID --- */
        /* ========================================== */
        .a4-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }

        .a4-card {
            width: 100%; aspect-ratio: 1 / 1.414; /* A4 RATIO */
            background: #000; border-radius: 16px; border: 2px solid var(--border-dark);
            position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer;
        }
        .a4-card:hover {
            transform: translateY(-8px) scale(1.02); border-color: var(--card-color, var(--gold));
            box-shadow: 0 15px 40px rgba(var(--card-rgb, 234, 179, 8), 0.3); z-index: 10;
        }
        .a4-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; opacity: 0.85; }
        .a4-card:hover img { transform: scale(1.08); opacity: 1; }

        .card-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.5) 40%, transparent 100%);
            display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; pointer-events: none;
        }

        .badge {
            position: absolute; top: 15px; left: 15px; background: var(--card-color, var(--pink)); color: #fff;
            padding: 6px 15px; border-radius: 8px; font-size: 0.85rem; font-weight: 900; letter-spacing: 1px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .card-overlay h3 { color: #fff; font-size: 1.4rem; font-weight: 900; margin-bottom: 15px; text-shadow: 0 2px 10px rgba(0,0,0,0.9); letter-spacing: 1px; text-align: center; }

        .btn-select {
            background: linear-gradient(45deg, var(--gold), #ffdf00); color: #000; border: none; padding: 12px 10px; border-radius: 8px;
            font-size: 1rem; font-weight: 900; width: 100%; pointer-events: auto; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 5px 15px rgba(234, 179, 8, 0.4);
        }
        .btn-select:hover { background: #fff; box-shadow: 0 5px 20px rgba(255,255,255,0.5); transform: translateY(-3px); }

        /* ========================================== */
        /* --- UNIQUE BOTTOM SHEET MODAL (PREMIUM) --- */
        /* ========================================== */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.92); backdrop-filter: blur(8px);
            z-index: 1000; display: flex; flex-direction: column; justify-content: flex-end;
            opacity: 0; visibility: hidden; transition: 0.4s ease;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }

        .modal-content {
            background: var(--bg-card); width: 100%; max-height: 90vh;
            border-top-left-radius: 30px; border-top-right-radius: 30px;
            padding: 25px; border-top: 3px solid var(--gold);
            transform: translateY(100%); transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column;
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }

        /* Image Banner Inside Modal (Always ca1.png) */
        .modal-image-banner {
            width: 100%; height: 160px; border-radius: 20px; overflow: hidden;
            position: relative; margin-bottom: 20px; border: 2px solid #333; box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .modal-image-banner img { width: 100%; height: 100%; object-fit: cover; }
        .modal-banner-overlay {
            position: absolute; inset: 0; background: linear-gradient(to top, #121212 5%, transparent 100%);
            display: flex; justify-content: space-between; align-items: flex-end; padding: 15px 20px;
        }
        .modal-banner-title h2 { color: #fff; font-size: 1.5rem; text-shadow: 0 2px 10px rgba(0,0,0,0.9); }
        .modal-banner-title h2 span { color: var(--gold); }

        .close-btn { background: #222; color: #fff; border: 2px solid #444; width: 40px; height: 40px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; position: absolute; top: 15px; right: 15px; z-index: 10;}
        .close-btn:hover { background: var(--pink); border-color: var(--pink); transform: rotate(90deg);}

        /* Scrolling Subject/Chapter List */
        .selection-list { overflow-y: auto; padding-right: 5px; display: flex; flex-direction: column; gap: 12px; padding-bottom: 20px;}
        .selection-list::-webkit-scrollbar { width: 5px; }
        .selection-list::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }

        .list-item {
            background: #1a1a1a; border: 1px solid #333; border-radius: 12px;
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            transition: 0.3s; cursor: pointer;
        }
        .list-item:hover { border-color: var(--gold); background: rgba(234, 179, 8, 0.05); transform: translateX(5px); }
        .item-name { color: #fff; font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 15px; }
        .item-name i { color: var(--cyan); font-size: 1.3rem; }
        .item-btn { background: var(--pink); color: #fff; border: none; padding: 8px 15px; border-radius: 6px; font-weight: 800; font-size: 0.85rem; cursor: pointer; transition: 0.3s;}
        .list-item:hover .item-btn { background: var(--gold); color: #000; }

        /* ========================================== */
        /* --- PROGRESS & ALERT --- */
        /* ========================================== */
        .progress-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95); z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .progress-overlay.active { display: flex; }
        .buffering-spinner { width: 80px; height: 80px; border: 6px solid rgba(234, 179, 8, 0.2); border-top: 6px solid var(--gold); border-radius: 50%; animation: bufferSpin 1s linear infinite; margin-bottom: 20px; }
        .progress-percent { font-size: 4rem; color: var(--gold); font-weight: 900; }
        
        .global-modal { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 10000; background: rgba(0, 0, 0, 0.9); opacity: 0; visibility: hidden; transition: 0.3s; }
        .global-modal.show { opacity: 1; visibility: visible; }
        .alert-box { background: var(--bg-card); border: 1px solid var(--border-dark); border-top: 4px solid var(--pink); padding: 30px; border-radius: 16px; max-width: 400px; width: 95%; text-align: center;}
        .alert-btn { background: var(--pink); color: #fff; font-weight: 800; padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 20px; }
    </style>
</head>
<body>

    <header class="portal-header">
        <div class="header-logo-box">
            <div class="logo-spin-wrap">
                <img src="abhinay.png" alt="Logo" class="inner-img" onerror="this.src='https://via.placeholder.com/50'">
            </div>
            <div class="header-text">
                <h1>AP MATHS VAULT</h1>
                <p>ULTIMATE STUDY PORTAL</p>
            </div>
        </div>
    </header>

    <div class="vault-container">
        
        <!-- Category Dropdown -->
        <div class="custom-dropdown-container">
            <div class="dropdown-header" onclick="toggleDropdown()" id="dropdownTitle">
                <span><i class="fas fa-layer-group" style="margin-right:8px;"></i> SELECT CLASS</span>
                <i class="fas fa-chevron-down" id="dropdownArrow"></i>
            </div>
            <div class="dropdown-list" id="dropdownList">
                <div class="dropdown-item active-item" onclick="selectCategory('CLASS 9', this)">CLASS 9 MATERIALS</div>
                <div class="dropdown-item" onclick="selectCategory('CLASS 10', this)">CLASS 10 MATERIALS</div>
                <div class="dropdown-item" onclick="selectCategory('CLASS 11', this)">CLASS 11 MATERIALS</div>
                <div class="dropdown-item" onclick="selectCategory('CLASS 12', this)">CLASS 12 MATERIALS</div>
                <div class="dropdown-item" onclick="selectCategory('MATHS SPECIAL', this)" style="color:var(--pink);">MATHS SPECIAL BATCH</div>
            </div>
        </div>

        <h2 class="section-title" id="dynamicTitle">CLASS 9 <span>MATERIALS</span></h2>

        <!-- Dynamic A4 Poster Grid -->
        <div class="a4-grid" id="vaultGrid"></div>

    </div>

    <!-- Enhanced Bottom Sheet Modal for Selection -->
    <div class="modal-overlay" id="selectionModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeSelector()"><i class="fas fa-times"></i></button>
            
            <!-- Unique Premium Banner Inside Modal (Always ca1.png) -->
            <div class="modal-image-banner">
                <img src="ca1.png" alt="Banner" onerror="this.src='https://via.placeholder.com/800x300/111/eab308?text=CA1.PNG'">
                <div class="modal-banner-overlay">
                    <div class="modal-banner-title">
                        <h2 id="modalTitle">SELECT <span>SUBJECT</span></h2>
                    </div>
                </div>
            </div>
            
            <!-- List of Subjects/Chapters -->
            <div class="selection-list" id="modalList">
                <!-- Items injected via JS -->
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="progress-overlay" id="progressOverlay">
        <div class="buffering-spinner"></div>
        <div class="progress-percent" id="progressCounter">1%</div>
        <div style="color:#fff; font-weight:700; margin-top:10px; letter-spacing:1px;">FETCHING SECURE PDF...</div>
    </div>

    <!-- Alert Modal -->
    <div class="global-modal" id="alertModal">
        <div class="alert-box">
            <i class="fas fa-exclamation-triangle" style="font-size:3rem; color:var(--pink); margin-bottom:15px;"></i>
            <h3 style="color:#fff; margin-bottom:10px;">PDF UNAVAILABLE</h3>
            <p id="alertMsg" style="color:var(--text-dim); font-size:0.9rem; line-height:1.6; text-transform:none;"></p>
            <button class="alert-btn" onclick="document.getElementById('alertModal').classList.remove('show')">OKAY, GOT IT</button>
        </div>
    </div>

    <script>
        // ==========================================
        // --- DATA REPOSITORY ---
        // ==========================================
        const subjectsStandard = ["Mathematics", "Science", "Social Science (SST)", "English", "Hindi"];
        const subjectsSenior = ["Mathematics", "Physics", "Chemistry", "Biology", "English"];
        const chaptersArithmetic = [
            "01. Number System", "02. Percentage", "03. Profit & Loss", "04. Simple Interest", 
            "05. Compound Interest", "06. Ratio & Proportion", "07. Mixture & Alligation", 
            "08. Time & Work", "09. Pipe & Cistern", "10. Speed, Time & Distance", "11. Boat & Stream"
        ];
        const chaptersAdvance = [
            "01. Algebra", "02. Trigonometry", "03. Height & Distance", "04. Geometry (Lines & Angles)",
            "05. Geometry (Triangles)", "06. Geometry (Circles)", "07. Mensuration 2D", 
            "08. Mensuration 3D", "09. Coordinate Geometry", "10. Data Interpretation (DI)"
        ];

        const icons = ["fa-book", "fa-atom", "fa-globe", "fa-language", "fa-calculator", "fa-chart-pie", "fa-square-root-alt"];

        // ==========================================
        // --- DROPDOWN & DYNAMIC RENDER ---
        // ==========================================
        function toggleDropdown() {
            const list = document.getElementById('dropdownList');
            const arrow = document.getElementById('dropdownArrow');
            list.classList.toggle('show');
            arrow.style.transform = list.classList.contains('show') ? 'rotate(180deg)' : 'rotate(0deg)';
        }

        function selectCategory(category, element) {
            document.getElementById('dropdownTitle').innerHTML = `<span><i class="fas fa-check-circle" style="color:var(--green); margin-right:8px;"></i> ${category}</span> <i class="fas fa-chevron-down" id="dropdownArrow"></i>`;
            document.getElementById('dynamicTitle').innerHTML = `${category} <span>MATERIALS</span>`;
            
            document.querySelectorAll('.dropdown-item').forEach(i => i.classList.remove('active-item'));
            element.classList.add('active-item');

            toggleDropdown();
            renderGrid(category);
        }

        function renderGrid(category) {
            const grid = document.getElementById('vaultGrid');
            grid.innerHTML = "";

            if(category === 'MATHS SPECIAL') {
                grid.innerHTML = `
                    <div class="a4-card" style="--card-color: #ff2a75; --card-rgb: 255,42,117;" onclick="triggerDownload('Maths Special Full Syllabus')">
                        <img src="syllabus.png" alt="Syllabus" onerror="this.src='https://via.placeholder.com/600x850/111/ff2a75?text=SYLLABUS.PNG'">
                        <div class="badge" style="background:var(--pink);">FULL SYLLABUS</div>
                        <div class="card-overlay">
                            <h3>MATHS SYLLABUS</h3>
                            <button class="btn-select" style="background:var(--pink); color:#fff;"><i class="fas fa-download"></i> DOWNLOAD NOW</button>
                        </div>
                    </div>
                    <div class="a4-card" style="--card-color: #22c55e; --card-rgb: 34,197,94;" onclick="openSelector('Maths Special', 'Arithmetic')">
                        <img src="syllabus.png" alt="Arithmetic" onerror="this.src='https://via.placeholder.com/600x850/111/22c55e?text=SYLLABUS.PNG'">
                        <div class="badge" style="background:var(--green);">ARITHMETIC</div>
                        <div class="card-overlay">
                            <h3>ARITHMETIC MATHS</h3>
                            <button class="btn-select"><i class="fas fa-list-ul"></i> CHOOSE CHAPTER</button>
                        </div>
                    </div>
                    <div class="a4-card" style="--card-color: #a855f7; --card-rgb: 168,85,247;" onclick="openSelector('Maths Special', 'Advance')">
                        <img src="syllabus.png" alt="Advance" onerror="this.src='https://via.placeholder.com/600x850/111/a855f7?text=SYLLABUS.PNG'">
                        <div class="badge" style="background:var(--purple);">ADVANCE</div>
                        <div class="card-overlay">
                            <h3>ADVANCE MATHS</h3>
                            <button class="btn-select"><i class="fas fa-list-ul"></i> CHOOSE CHAPTER</button>
                        </div>
                    </div>
                `;
            } else {
                // Class 9, 10, 11, 12
                let subList = (category === 'CLASS 9' || category === 'CLASS 10') ? 'Standard' : 'Senior';
                
                grid.innerHTML = `
                    <div class="a4-card" style="--card-color: #00bcd4; --card-rgb: 0,188,212;" onclick="openSelector('${category}', 'Syllabus', '${subList}')">
                        <img src="syllabus.png" alt="Syllabus" onerror="this.src='https://via.placeholder.com/600x850/111/00bcd4?text=SYLLABUS.PNG'">
                        <div class="badge">SYLLABUS</div>
                        <div class="card-overlay">
                            <h3>${category} SYLLABUS</h3>
                            <button class="btn-select"><i class="fas fa-hand-pointer"></i> CHOOSE SUBJECT</button>
                        </div>
                    </div>
                    <div class="a4-card" style="--card-color: #eab308; --card-rgb: 234,179,8;" onclick="openSelector('${category}', 'Formulas', '${subList}')">
                        <img src="syllabus.png" alt="Formula" onerror="this.src='https://via.placeholder.com/600x850/111/eab308?text=SYLLABUS.PNG'">
                        <div class="badge" style="background:var(--gold); color:#000;">FORMULAS</div>
                        <div class="card-overlay">
                            <h3>${category} FORMULAS</h3>
                            <button class="btn-select"><i class="fas fa-hand-pointer"></i> CHOOSE SUBJECT</button>
                        </div>
                    </div>
                `;
            }
        }

        // ==========================================
        // --- MODAL LOGIC WITH CA1.PNG BANNER ---
        // ==========================================
        function openSelector(category, type, listType) {
            const modal = document.getElementById('selectionModal');
            const title = document.getElementById('modalTitle');
            const list = document.getElementById('modalList');
            
            list.innerHTML = ""; // Clear old items

            let dataArray = [];
            
            if (category === 'Maths Special') {
                title.innerHTML = `${type.toUpperCase()} <span>CHAPTERS</span>`;
                dataArray = (type === 'Arithmetic') ? chaptersArithmetic : chaptersAdvance;
            } else {
                title.innerHTML = `${category} <span>${type.toUpperCase()}</span>`;
                dataArray = (listType === 'Standard') ? subjectsStandard : subjectsSenior;
            }

            // Populate the list
            dataArray.forEach((item, index) => {
                let randomIcon = icons[index % icons.length];
                list.innerHTML += `
                    <div class="list-item" onclick="triggerDownload('${item} - ${type}')">
                        <div class="item-name"><i class="fas ${randomIcon}"></i> ${item}</div>
                        <button class="item-btn"><i class="fas fa-download"></i> PDF</button>
                    </div>
                `;
            });

            modal.classList.add('active');
            document.body.style.overflow = "hidden";
        }

        function closeSelector() {
            document.getElementById('selectionModal').classList.remove('active');
            document.body.style.overflow = "auto";
        }

        // ==========================================
        // --- DOWNLOAD SIMULATION ---
        // ==========================================
        function triggerDownload(fileName) {
            closeSelector(); 
            const overlay = document.getElementById('progressOverlay');
            const counter = document.getElementById('progressCounter');
            overlay.classList.add('active');
            
            let currentPercent = 1;
            let interval = setInterval(() => {
                counter.innerText = currentPercent + "%";
                currentPercent += 4; 
                
                if(currentPercent > 100) {
                    counter.innerText = "100%";
                    clearInterval(interval);
                    setTimeout(() => {
                        overlay.classList.remove('active');
                        document.getElementById('alertMsg').innerHTML = `The file <span style="color:var(--pink); font-weight:800;">"${fileName}"</span> is currently unavailable or being updated.`;
                        document.getElementById('alertModal').classList.add('show');
                    }, 400);
                }
            }, 30); 
        }

        // Initialize on Load
        document.addEventListener('DOMContentLoaded', () => {
            renderGrid('CLASS 9');
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', function(event) {
            const container = document.querySelector('.custom-dropdown-container');
            if (!container.contains(event.target)) {
                document.getElementById('dropdownList').classList.remove('show');
                document.getElementById('dropdownArrow').style.transform = 'rotate(0deg)';
            }
        });
    </script>
</body>
</html>
